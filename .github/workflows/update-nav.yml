name: 每日更新淨值

on:
  # 22:00 UTC = 台北隔日 06:00。此時台股當日與美股前一交易日皆已收盤。
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - claude/fund-comparison-dividend-site-qqg4sk
    paths:
      - 'fund-report/scripts/update-nav.mjs'
      - '.github/workflows/update-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取最新價格
        run: node fund-report/scripts/update-nav.mjs

      - name: 重新打包單一檔案版本
        run: python3 fund-report/build-standalone.py

      - name: 有變動才提交
        run: |
          if [ -z "$(git status --porcelain fund-report/data fund-report/standalone.html)" ]; then
            echo "沒有變動，略過提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fund-report/data fund-report/standalone.html
          git commit -m "資料：更新每日淨值（$(date -u +%Y-%m-%d)）"
          git push
